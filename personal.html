<!--
  ============================================================
  SERVICE PAGE TEMPLATE
  ============================================================
  How to use this file for a new service (e.g. Wedding, Business
  portrait, Macro, Product, Advertising...):

  1. Duplicate this file and rename it, e.g. "wedding.html".
  2. Edit the <title> and <meta name="description"> below.
  3. Edit the two words in the ".hero" section (small title +
     big project name) further down.
  4. Add your images inside the ".story" section:
       - One photo full-width  -> copy a <figure class="story__item">
         block.
       - Two photos side by side -> copy the <div class="story__pair">
         block (it holds exactly 2 story__item figures).
       - Just delete blocks you don't need, or paste in more —
         there's no fixed limit, add as many as you like.
  5. If you want an "other work" section like ДРУГИЕ, keep the
     <h2 class="story__label section-label"> line and put more
     story__item figures under it. Delete that block if you don't
     need a second section.
  6. Update images/... paths to your new photos (drop the files
     into the /images folder first).
  7. Once the page is ready, link to it from a service card on
     index.html (change its href from "works.html" to your new
     file name).
  ============================================================
-->

      <span></span><span></span><span></span>
    </button>
  </nav>

<main>

  <!-- HERO — small word top-left, project/service name top-right -->
  <section class="fashion-hero">
    <div class="fashion-hero__grid">
      <h1 class="fashion-hero__title">ИНДИВИДУАЛЬНАЯ СЪЕМКА</h1>
      <p class="fashion-hero__project">НАЗВАНИЕ<br>ПРОЕКТА</p>
    </div>
  </section>

  <!--
    STORY SEQUENCE — add / remove / reorder freely.
    Each photo is one ".story__item" block. To place two photos
    side by side, wrap two ".story__item" blocks in a ".story__pair" div.
  -->
  <section class="story">

    <!-- Single full-width photo -->
    <figure class="story__item">
      <img src="images/fashion-1.jpg" alt="Описание фото" loading="eager">
    </figure>

    <!-- Two photos side by side -->
    <div class="story__pair">
      <figure class="story__item">
        <img src="images/fashion-2.jpg" alt="Описание фото" loading="lazy">
      </figure>
      <figure class="story__item">
        <img src="images/fashion-3.jpg" alt="Описание фото" loading="lazy">
      </figure>
    </div>

    <!-- Another single full-width photo — copy this block for each extra photo -->
    <figure class="story__item">
      <img src="images/fashion-4.jpg" alt="Описание фото" loading="lazy">
    </figure>

    <!--
      OTHER WORKS SECTION (optional).
      Delete the <h2> + figures below if this page doesn't need
      a second "other photos" group.
    -->
    <h2 class="story__label section-label">ДРУГИЕ</h2>

    <figure class="story__item">
      <img src="images/fashion-9.jpg" alt="Описание фото" loading="lazy">
    </figure>

    <div class="story__cta">
      <a href="contacts.html" class="btn-pill">ЗАКАЗАТЬ СЪЕМКУ</a>
    </div>

  </section>

</main>
